<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Drive the pi coding agent on your Mac from your phone." />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>%APP_NAME%</title>
    <script>
      // The saved palette (`src/lib/palettes.ts`) before first paint; the app keeps it in sync.
      try {
        const palette = JSON.parse(localStorage.getItem("pi-code:ui-prefs")).state.palette;
        if (palette) document.documentElement.dataset.palette = palette;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
